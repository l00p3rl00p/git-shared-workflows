name: Lint: Shell and YAML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-shell-yaml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-shell-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck every shell script (by extension or bash/sh shebang)
        run: |
          set -euo pipefail
          { git ls-files '*.sh'; git ls-files -z | xargs -0 grep -l -I -E '^#!.*/(env )?(ba|z)?sh' 2>/dev/null || true; } | sort -u | xargs -r shellcheck
      - run: pip install yamllint
      - run: yamllint .
