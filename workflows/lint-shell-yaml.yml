name: Lint: Shell and YAML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-shell-yaml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-shell-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck every shell script (by extension or bash/sh shebang)
        run: |
          set -euo pipefail
          for f in $(git ls-files); do
            case "$f" in *.sh) echo "$f" ;; *) head -n1 "$f" 2>/dev/null | grep -q -E '^#!.*/(env )?(ba|z)?sh' && echo "$f" ;; esac
          done | sort -u | xargs -r shellcheck
      - run: pip install yamllint
      - run: yamllint .
