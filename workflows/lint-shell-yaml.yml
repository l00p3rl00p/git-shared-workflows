name: Lint: Shell and YAML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-shell-yaml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-shell-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files '*.sh' | xargs -r shellcheck
      - run: pip install yamllint
      - run: yamllint .
