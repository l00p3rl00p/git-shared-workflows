name: Lint: Python
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff ty
      - run: ruff check .
      - run: ruff format --check .
      - run: ty check
