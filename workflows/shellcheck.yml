# Shell script lint (ShellCheck, preinstalled on GitHub's Ubuntu runners). Reports only.
name: ShellCheck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files '*.sh' | xargs -r shellcheck
