# Python lint and format check (ruff). Reports only; changes nothing.
name: Ruff
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
