name: Verify reusable ACC packaging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dsh-acc-package.yml"
      - ".github/workflows/verify-acc-package.yml"
  pull_request:
    paths:
      - ".github/workflows/dsh-acc-package.yml"
      - ".github/workflows/verify-acc-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: l00p3rl00p/git-shared-workflows/.github/workflows/dsh-acc-package.yml@main
    with:
      source_repository: l00p3rl00p/dsh-auto-code-correct
      source_ref: main
      plugin_path: "."
