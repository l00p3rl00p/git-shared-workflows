name: Verify structural analysis tools
on:
  push:
    branches: [main, 'test/structural-tools-negative']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: structural-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-structural-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tree-sitter and NetworkX
        run: python -m pip install networkx tree-sitter tree-sitter-python tree-sitter-rust tree-sitter-typescript tree-sitter-bash
      - name: Exercise AST, Tree-sitter, and NetworkX
        shell: python
        run: |
          import ast
          import networkx as nx
          from tree_sitter import Language, Parser
          import tree_sitter_python
          import tree_sitter_rust
          import tree_sitter_typescript
          import tree_sitter_bash

          source = b"def answer(:\n    return 42\n"
          parsed = ast.parse(source.decode())
          assert isinstance(parsed.body[0], ast.FunctionDef)
          grammars = [
              (tree_sitter_python.language(), b"def answer():\n    return 42\n"),
              (tree_sitter_rust.language(), b"fn answer() -> i32 { 42 }"),
              (tree_sitter_typescript.language_typescript(), b"function answer(): number { return 42; }"),
              (tree_sitter_bash.language(), b"echo hello\n"),
          ]
          for grammar, sample in grammars:
              tree = Parser(Language(grammar)).parse(sample)
              assert not tree.root_node.has_error, tree.root_node
          graph = nx.DiGraph()
          graph.add_edges_from([("source", "parser"), ("parser", "result")])
          assert list(nx.topological_sort(graph)) == ["source", "parser", "result"]
          print("Python AST, Tree-sitter grammars, and NetworkX verified")
